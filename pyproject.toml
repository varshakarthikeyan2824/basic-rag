[project]
name = "rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "varshakarthikeyan28", email = "varsharsk28@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "tiktoken>=0.14.0",
]

[project.scripts]
rag-agent = "rag_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
